name: KingFloat

options:
  bundleIdPrefix: top.weilua
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KingFloat:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - AppDelegate.swift
      - SceneDelegate.swift
      - MapViewController.swift
      - PiPController.swift
      - ImageFrame.swift
      - SilentAudioPlayer.swift
      - KeepAliveScript.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.weilua.kingfloat
        PRODUCT_NAME: KingFloat
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  KingFloat:
    build:
      targets:
        KingFloat: all
    run:
      config: Debug
    archive:
      config: Release
